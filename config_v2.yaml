exchange:
  id: binance
  api_key: ""
  api_secret: ""
  api_passphrase: ""
  symbol: BTC/USDT
  timeframe: 4h
  use_margin: true
  margin_mode: isolated
  leverage: 3

trading:
  dry_run: true
  paper_equity_eur: 1000.0
  poll_seconds: 60
  candles_limit: 400
  allow_short: true
  maker_only: true
  risk_per_trade: 0.01
  max_daily_drawdown: 0.05
  max_notional_eur: 50000.0
  fee_rate_maker: 0.001
  fee_rate_taker: 0.001

strategy:
  ema_fast: 20
  ema_slow: 50
  ema_regime: 200
  breakout_lookback: 20
  atr_period: 14
  atr_stop_mult: 2.5
  rr_take_profit: 3.0
  min_volume_ratio: 1.5
  min_atr_percentile: 0.40
  adx_period: 14
  min_adx: 25
  ema_slope_lookback: 5

storage:
  state_file: state.json
  trades_file: trades.csv
  backtest_trades_file: backtest_trades.csv
